<main class="page">
  <h1>Composants</h1>

  <section class="glass panel" aria-labelledby="h-cards">
    <h2 id="h-cards">Cartes</h2>
    @for (row of rows; track row.color) {
      <div class="row">
        @for (c of row.cards; track c.id) {
          <app-card [card]="c" class="small" />
        }
      </div>
    }
    <div class="row">
      @for (w of wilds; track w.id) {
        <app-card [card]="w" class="small" />
      }
      @for (color of colors; track color) {
        <app-card [card]="wilds[0]" [chosenColor]="color" class="small" />
      }
      <app-card-back class="small" />
    </div>
  </section>

  <section class="glass panel" aria-labelledby="h-states">
    <h2 id="h-states">États</h2>
    <div class="row states">
      <figure>
        <app-card [card]="rows[0].cards[7]" state="playable" />
        <figcaption>Jouable</figcaption>
      </figure>
      <figure>
        <app-card [card]="rows[3].cards[3]" state="unplayable" />
        <figcaption>Non jouable</figcaption>
      </figure>
      <figure>
        <app-card [card]="rows[1].cards[11]" />
        <figcaption>Neutre</figcaption>
      </figure>
    </div>
  </section>

  <section class="glass panel" aria-labelledby="h-ui">
    <h2 id="h-ui">Boutons et formes</h2>
    <div class="row">
      <button appNeonButton>Créer un salon</button>
      <button appNeonButton variant="outline">Rejoindre</button>
      <button appNeonButton variant="ghost">Quitter</button>
      <button appNeonButton tone="pink" disabled>Désactivé</button>
    </div>
    <div class="row names">
      @for (color of colors; track color) {
        <span [class]="'tint-' + color"
          ><app-color-symbol [color]="color" /> {{ colorName[color] }}</span
        >
      }
    </div>
  </section>
</main>
