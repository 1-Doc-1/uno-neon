<main class="page">
  <app-logo [size]="56" />

  <section class="panel box" aria-labelledby="h-cards">
    <h2 id="h-cards">Cartes</h2>
    @for (row of rows; track row.color) {
      <div class="row">
        @for (c of row.cards; track c.id) {
          <app-card [card]="c" class="small" />
        }
      </div>
    }
    <div class="row">
      @for (w of wilds; track w.id) {
        <app-card [card]="w" class="small" />
      }
      @for (color of colors; track color) {
        <app-card [card]="wilds[0]" [chosenColor]="color" class="small" />
      }
      <app-card-back class="small" />
      <app-card [card]="rows[0].cards[7]" state="playable" class="small" />
      <app-card [card]="rows[3].cards[3]" state="unplayable" class="small" />
      <app-card [card]="rows[1].cards[5]" [top]="true" class="small" />
    </div>
  </section>

  <section class="panel box" aria-labelledby="h-ui">
    <h2 id="h-ui">Boutons, formes et icônes</h2>
    <div class="row">
      <button appButton kind="primary">Créer un salon</button>
      <button appButton kind="danger"><app-icon name="door" /> Quitter</button>
      <button appButton kind="uno">UNO !</button>
      <button appButton kind="neutral">Rejoindre</button>
      <button appButton kind="ghost">Annuler</button>
      <button appButton kind="primary" aria-disabled="true">Atténué</button>
    </div>
    <div class="row names">
      @for (color of colors; track color) {
        <span [class]="'tint-' + color"
          ><app-color-symbol [color]="color" /> {{ colorName[color] }}</span
        >
      }
    </div>
    <div class="row icons">
      @for (name of icons; track name) {
        <app-icon [name]="name" />
      }
    </div>
  </section>
</main>
