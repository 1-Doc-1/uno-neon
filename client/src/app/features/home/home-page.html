<main class="page">
  <h1 class="logo"><app-logo [size]="72" /></h1>

  <section class="panel box" aria-label="Rejoindre une partie">
    <label class="field">
      <span>Ton pseudo</span>
      <input type="text" autocomplete="nickname" [formField]="form.nickname" />
    </label>

    <button appButton kind="primary" (click)="create()" [disabled]="!canCreate()">
      Créer un salon
    </button>

    <p class="divider" aria-hidden="true"><span>ou</span></p>

    <div class="join">
      <label class="field grow">
        <span>Code du salon</span>
        <input
          type="text"
          class="code"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          placeholder="K7M4XP"
          [formField]="form.code"
        />
      </label>
      <button appButton kind="neutral" (click)="join()" [disabled]="!canJoin()">Rejoindre</button>
    </div>

    @if (!store.ready()) {
      <p class="hint">Connexion au serveur…</p>
    }
  </section>

  <button
    appButton
    kind="ghost"
    class="theme"
    (click)="theme.toggle()"
    [attr.aria-label]="'Changer de thème (actuel : ' + theme.theme() + ')'"
  >
    <app-icon name="palette" /> Thème {{ theme.theme() === 'tapis' ? 'Tapis' : 'Nuit' }}
  </button>
</main>
