<main class="page">
  <app-sound-control class="sound-corner" />
  <h1 class="logo"><app-logo [size]="72" /></h1>

  <section class="panel box" aria-label="Commencer à jouer">
    <label class="field">
      <span>Ton pseudo</span>
      <input type="text" autocomplete="nickname" [formField]="form.nickname" />
    </label>

    <div class="choices">
      <button
        type="button"
        class="choice main"
        (click)="playAgainstBots()"
        [disabled]="!canStart()"
      >
        <app-icon name="bot" class="icon" />
        <span class="text">
          <strong>Jouer contre des bots</strong>
          <span>Une partie tout de suite, sans attendre personne</span>
        </span>
      </button>

      <button type="button" class="choice" (click)="create()" [disabled]="!canCreate()">
        <app-icon name="cards" class="icon" />
        <span class="text">
          <strong>Créer un salon</strong>
          <span>Invite tes amis avec un code</span>
        </span>
      </button>

      <div class="choice join" role="group" aria-labelledby="join-title">
        <app-icon name="link" class="icon" />
        <div class="text">
          <strong id="join-title">Rejoindre un salon</strong>
          <div class="join-row">
            <label class="field grow">
              <input
                type="text"
                class="code"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                placeholder="K7M4XP"
                aria-label="Code du salon"
                [formField]="form.code"
              />
            </label>
            <button appButton kind="neutral" (click)="join()" [disabled]="!canJoin()">
              Rejoindre
            </button>
          </div>
        </div>
      </div>
    </div>

    @if (!store.ready()) {
      <p class="hint">Connexion au serveur…</p>
    }
  </section>
</main>
